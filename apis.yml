aid: moonwalk-biosciences
name: Moonwalk Biosciences
description: 'Moonwalk Biosciences is a preclinical biotechnology company pioneering
  therapeutics in adipose biology driven by deep genetic and epigenetic insights.
  Co-founded by Feng Zhang, Alex Aravanis, Arash Jamshidi and Justin Valley, the company
  developed a multiplex epigenetic engineering platform and has publicly shifted its
  focus toward siRNA-based obesity and cardiometabolic therapies. It is a private,
  research-stage drug-discovery organization backed by GV; its public surface is a
  corporate/marketing website covering its science, pipeline, team, careers and news,
  with no public API, developer portal, or machine-readable discovery documents.'
